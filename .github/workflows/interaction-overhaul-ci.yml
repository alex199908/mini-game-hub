name: Interaction Overhaul CI

on:
  push:
    branches:
      - feat/interaction-overhaul

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/interaction-overhaul
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and refresh lockfile
        run: npm install --package-lock-only
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh lockfile for chess.js"
          git push origin HEAD:feat/interaction-overhaul
